openapi: 3.0.1
info:
  title: Form Builder API
  description: 'Dynamic Form Builder backend using .NET, SQL, and MongoDB'
  version: v1
paths:
  '/api/admin/forms/{formId}/responses':
    get:
      tags:
        - Admin
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      responses:
        '200':
          description: OK
  /api/Auth/login:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
      responses:
        '200':
          description: OK
  /api/Auth/register:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
      responses:
        '200':
          description: OK
  /api/forms:
    get:
      tags:
        - Form
      responses:
        '200':
          description: OK
  '/api/forms/{id}':
    get:
      tags:
        - Form
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      responses:
        '200':
          description: OK
    put:
      tags:
        - Form
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/FormDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/FormDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/FormDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FormDTO'
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Form
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      responses:
        '200':
          description: OK
  /api/forms/Formconfig:
    post:
      tags:
        - Form
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/FormConfigDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/FormConfigDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/FormConfigDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FormConfigDTO'
      responses:
        '200':
          description: OK
  '/api/forms/{formId}/Formlayout':
    post:
      tags:
        - Form
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/FormLayoutDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/FormLayoutDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/FormLayoutDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FormLayoutDTO'
      responses:
        '200':
          description: OK
  '/api/forms/{id}/publish':
    put:
      tags:
        - Form
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      responses:
        '200':
          description: OK
  '/api/forms/{formId}/responses':
    post:
      tags:
        - Response
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ResponseDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/ResponseDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ResponseDTO'
      responses:
        '200':
          description: OK
    get:
      tags:
        - Response
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            maxLength: 24
            minLength: 24
            type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    AuthDTO:
      required:
        - password
        - username
      type: object
      properties:
        username:
          minLength: 1
          type: string
        password:
          minLength: 1
          type: string
        role:
          type: string
          nullable: true
      additionalProperties: false
    FieldOptionDTO:
      type: object
      properties:
        optionId:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
      additionalProperties: false
    FormConfigDTO:
      required:
        - title
      type: object
      properties:
        title:
          minLength: 1
          type: string
        description:
          type: string
          nullable: true
      additionalProperties: false
    FormDTO:
      required:
        - config
        - createdBy
        - layout
        - status
      type: object
      properties:
        id:
          type: string
          nullable: true
        config:
          $ref: '#/components/schemas/FormConfigDTO'
        layout:
          $ref: '#/components/schemas/FormLayoutDTO'
        status:
          $ref: '#/components/schemas/FormStatus'
        createdBy:
          minLength: 1
          type: string
        publishedBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    FormFieldDTO:
      required:
        - label
        - type
      type: object
      properties:
        questionId:
          type: string
          nullable: true
        label:
          minLength: 1
          type: string
        type:
          minLength: 1
          type: string
        descriptionEnabled:
          type: boolean
        description:
          type: string
          nullable: true
        singleChoice:
          type: boolean
        multipleChoice:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/FieldOptionDTO'
          nullable: true
        format:
          type: string
          nullable: true
        required:
          type: boolean
        order:
          type: integer
          format: int32
      additionalProperties: false
    FormHeaderCardDTO:
      required:
        - title
      type: object
      properties:
        id:
          type: string
          nullable: true
        title:
          minLength: 1
          type: string
        description:
          type: string
          nullable: true
      additionalProperties: false
    FormLayoutDTO:
      required:
        - headerCard
      type: object
      properties:
        headerCard:
          $ref: '#/components/schemas/FormHeaderCardDTO'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldDTO'
          nullable: true
      additionalProperties: false
    FormStatus:
      enum:
        - Draft
        - Published
      type: string
    ResponseAnswerDTO:
      required:
        - questionId
      type: object
      properties:
        answerId:
          type: string
          format: uuid
          nullable: true
        questionId:
          minLength: 1
          type: string
        answerText:
          type: string
          nullable: true
      additionalProperties: false
    ResponseDTO:
      required:
        - answers
        - formId
      type: object
      properties:
        responseId:
          type: string
          format: uuid
          nullable: true
        formId:
          minLength: 1
          type: string
        submittedBy:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ResponseAnswerDTO'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: 'Enter ''Bearer {your token}'''
      name: Authorization
      in: header
security:
  - Bearer: [ ]